version: '3.8'

services:
  sentiment-api:
    build: .
    container_name: sentiment-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/model/model.joblib
    volumes:
      - ../Sentiment model/results/model.joblib:/app/model/model.joblib:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
